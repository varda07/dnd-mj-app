# Configuration Supabase CLI — projet Master Screen.
# Généré manuellement (équivalent de `supabase init`). Le rattachement au
# projet distant se fait via `supabase link --project-ref llqiojlwbrhiqgztizun`
# (il stocke la référence dans supabase/.temp/, hors du dépôt).

project_id = "dnd-mj-app"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Version majeure de PostgreSQL — alignée sur le projet distant (PG 17) pour
# éviter le warning « Local database version differs ».
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
